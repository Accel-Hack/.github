<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Tabs B3 — Split Plates</title>
    <link rel="stylesheet" href="./b-variations-shared.css" />
    <style>
      .split {
        position: fixed;
        top: 50%;
        right: 0;
        z-index: 10;
        display: grid;
        gap: 10px;
        width: 184px;
        transform: translateY(-50%);
      }
      .split a {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        min-height: 64px;
        color: var(--ink);
        text-decoration: none;
        filter: drop-shadow(12px 14px 12px rgba(17, 19, 17, 0.18));
        transition: transform 0.3s ease;
      }
      .split a:hover,
      .split a:focus-visible {
        transform: translateX(-14px);
      }
      .num {
        display: grid;
        place-items: center;
        background: var(--ink);
        color: var(--green);
        font-size: 8px;
        letter-spacing: 0.12em;
      }
      .plate {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 18px;
        gap: 8px;
        align-items: center;
        padding: 0 14px 0 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.95);
        background: rgba(250, 250, 250, 0.96);
        transition: background 0.3s ease;
      }
      .plate::after {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 34%;
        height: 3px;
        background: var(--green);
        content: '';
      }
      .split a:hover .plate,
      .split a:focus-visible .plate {
        background: var(--green);
      }
      .plate strong {
        font-size: 14px;
      }
      .plate i {
        font-size: 14px;
        font-style: normal;
      }
      .split .contact .plate {
        background: #4b4f4c;
        color: var(--white);
      }
      .split .contact .plate::after {
        width: 100%;
      }
      @media (max-width: 720px) {
        .split {
          width: 66px;
          gap: 7px;
        }
        .split a {
          grid-template-columns: 22px 44px;
          min-height: 58px;
        }
        .plate {
          grid-template-columns: 1fr;
          justify-items: center;
          padding: 0;
        }
        .plate strong {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-head">
      <div class="logo">ACCELHACK<small>.inc</small></div>
      <span>OPTION B3 / SPLIT PLATES</span>
    </header>
    <main class="frame">
      <p class="page-title">About</p>
      <section class="panel">
        <span class="eyebrow">ACCELHACK / ABOUT</span>
        <h1>ただのSIerじゃ、<br />つまらない。</h1>
        <p class="copy">
          見つけるところから維持するところまで、課題解決のすべてに答えを出します。
        </p>
      </section>
      <span class="option-label">B3 / GRAPHIC AND STRUCTURED</span>
    </main>
    <nav class="split" aria-label="ページナビゲーション">
      <a href="#"
        ><span class="num">01</span
        ><span class="plate"><strong>Works</strong><i>→</i></span></a
      >
      <a href="#"
        ><span class="num">02</span
        ><span class="plate"><strong>Recruit</strong><i>→</i></span></a
      >
      <a href="#"
        ><span class="num">03</span
        ><span class="plate"><strong>Blog</strong><i>→</i></span></a
      >
      <a class="contact" href="#"
        ><span class="num">04</span
        ><span class="plate"><strong>Contact</strong><i>→</i></span></a
      >
    </nav>
  </body>
</html>
