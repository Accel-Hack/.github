<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Tabs B — Floating Plates</title>
    <style>
      :root {
        --paper: #f5f4f2;
        --white: #fafafa;
        --ink: #111311;
        --muted: #747b76;
        --line: rgba(17, 19, 17, 0.17);
        --green: #21ffaa;
        --green-ink: #08734c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, 'Noto Sans JP', sans-serif;
      }
      .site-head {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        letter-spacing: 0.12em;
      }
      .logo {
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .logo small {
        margin-left: 2px;
        font-size: 8px;
        font-weight: 400;
      }
      .frame {
        position: relative;
        height: calc(100vh - 88px);
        margin: 0 22px;
        padding: 34px 38px;
        border: 1px solid var(--line);
        background: rgba(250, 250, 250, 0.74);
        overflow: hidden;
      }
      .frame::before,
      .frame::after {
        position: absolute;
        width: 72px;
        height: 72px;
        border-color: var(--ink);
        content: '';
      }
      .frame::before {
        top: 8px;
        left: 8px;
        border-top: 2px solid;
        border-left: 2px solid;
      }
      .frame::after {
        right: 8px;
        bottom: 8px;
        border-right: 2px solid;
        border-bottom: 2px solid;
      }
      .page-title {
        margin: 0 0 34px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
        font-size: clamp(32px, 4vw, 58px);
        font-weight: 500;
      }
      .panel {
        width: calc(100% - 136px);
        min-height: 66vh;
        padding: clamp(32px, 5vw, 72px);
        border: 1px solid var(--line);
        background:
          linear-gradient(132deg, rgba(33, 255, 170, 0.12), transparent 38%),
          var(--white);
      }
      .eyebrow {
        color: var(--green-ink);
        font-size: 9px;
        letter-spacing: 0.18em;
      }
      h1 {
        max-width: 820px;
        margin: 42px 0 0;
        font-size: clamp(38px, 6vw, 86px);
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.065em;
      }
      .copy {
        max-width: 520px;
        margin: 34px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 2;
      }
      .option-label {
        position: absolute;
        left: 38px;
        bottom: 18px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.16em;
      }
      .plates {
        position: fixed;
        top: 50%;
        right: 0;
        z-index: 10;
        display: grid;
        gap: 11px;
        width: 164px;
        transform: translateY(-50%);
        perspective: 900px;
      }
      .plates a {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 24px;
        align-items: center;
        min-height: 62px;
        padding: 0 14px 0 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.94);
        background: rgba(250, 250, 250, 0.94);
        box-shadow:
          14px 16px 22px rgba(17, 19, 17, 0.18),
          -1px 0 0 rgba(17, 19, 17, 0.12);
        color: var(--ink);
        text-decoration: none;
        transform: translateX(var(--offset)) rotateY(-3deg);
        transform-origin: right center;
        transition:
          transform 0.32s ease,
          background 0.32s ease;
      }
      .plates a:nth-child(1) {
        --offset: 18px;
      }
      .plates a:nth-child(2) {
        --offset: 2px;
      }
      .plates a:nth-child(3) {
        --offset: 10px;
      }
      .plates a:nth-child(4) {
        --offset: -4px;
      }
      .plates a:hover,
      .plates a:focus-visible {
        z-index: 2;
        background: var(--green);
        transform: translateX(-12px) rotateY(0);
      }
      .plates a::after {
        position: absolute;
        top: 0;
        left: 0;
        width: 3px;
        height: 100%;
        background: var(--green);
        content: '';
      }
      .plates strong {
        font-size: 14px;
      }
      .plates small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 7px;
        letter-spacing: 0.14em;
      }
      .plates i {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: var(--white);
        font-size: 9px;
        font-style: normal;
      }
      .plates .contact {
        background: #4b4f4c;
        color: var(--white);
      }
      .plates .contact small {
        color: rgba(255, 255, 255, 0.62);
      }
      @media (max-width: 720px) {
        .frame {
          margin: 0 8px;
          padding: 24px 18px;
        }
        .panel {
          width: calc(100% - 66px);
          padding: 28px 24px;
        }
        .plates {
          width: 66px;
          gap: 7px;
        }
        .plates a {
          grid-template-columns: 1fr;
          justify-items: center;
          min-height: 56px;
          padding: 0;
          transform: none;
        }
        .plates strong,
        .plates small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-head">
      <div class="logo">ACCELHACK<small>.inc</small></div>
      <span>OPTION B / FLOATING PLATES</span>
    </header>
    <main class="frame">
      <p class="page-title">About</p>
      <section class="panel">
        <span class="eyebrow">ACCELHACK / ABOUT</span>
        <h1>ただのSIerじゃ、<br />つまらない。</h1>
        <p class="copy">
          見つけるところから維持するところまで、課題解決のすべてに答えを出します。
        </p>
      </section>
      <span class="option-label">B / DEPTH, MOTION, FAMILIARITY</span>
    </main>
    <nav class="plates" aria-label="ページナビゲーション">
      <a href="#"
        ><span><strong>Works</strong><small>01 / PROJECTS</small></span
        ><i>→</i></a
      >
      <a href="#"
        ><span><strong>Recruit</strong><small>02 / PEOPLE</small></span
        ><i>→</i></a
      >
      <a href="#"
        ><span><strong>Blog</strong><small>03 / JOURNAL</small></span
        ><i>→</i></a
      >
      <a class="contact" href="#"
        ><span><strong>Contact</strong><small>04 / CONNECT</small></span
        ><i>→</i></a
      >
    </nav>
  </body>
</html>
