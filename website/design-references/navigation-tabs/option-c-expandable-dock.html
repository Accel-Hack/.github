<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Tabs C — Expandable Dock</title>
    <style>
      :root {
        --paper: #f5f4f2;
        --white: #fafafa;
        --ink: #111311;
        --muted: #747b76;
        --line: rgba(17, 19, 17, 0.17);
        --green: #21ffaa;
        --green-ink: #08734c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, 'Noto Sans JP', sans-serif;
      }
      .site-head {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        letter-spacing: 0.12em;
      }
      .logo {
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .logo small {
        margin-left: 2px;
        font-size: 8px;
        font-weight: 400;
      }
      .frame {
        position: relative;
        height: calc(100vh - 88px);
        margin: 0 22px;
        padding: 34px 38px;
        border: 1px solid var(--line);
        background: rgba(250, 250, 250, 0.74);
        overflow: hidden;
      }
      .frame::before,
      .frame::after {
        position: absolute;
        width: 72px;
        height: 72px;
        border-color: var(--ink);
        content: '';
      }
      .frame::before {
        top: 8px;
        left: 8px;
        border-top: 2px solid;
        border-left: 2px solid;
      }
      .frame::after {
        right: 8px;
        bottom: 8px;
        border-right: 2px solid;
        border-bottom: 2px solid;
      }
      .page-title {
        margin: 0 0 34px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
        font-size: clamp(32px, 4vw, 58px);
        font-weight: 500;
      }
      .panel {
        width: calc(100% - 74px);
        min-height: 66vh;
        padding: clamp(32px, 5vw, 72px);
        border: 1px solid var(--line);
        background:
          linear-gradient(132deg, rgba(33, 255, 170, 0.12), transparent 38%),
          var(--white);
      }
      .eyebrow {
        color: var(--green-ink);
        font-size: 9px;
        letter-spacing: 0.18em;
      }
      h1 {
        max-width: 820px;
        margin: 42px 0 0;
        font-size: clamp(38px, 6vw, 86px);
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.065em;
      }
      .copy {
        max-width: 520px;
        margin: 34px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 2;
      }
      .option-label {
        position: absolute;
        left: 38px;
        bottom: 18px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.16em;
      }
      .dock {
        position: fixed;
        top: 50%;
        right: 0;
        z-index: 10;
        width: 64px;
        padding: 8px 0;
        transform: translateY(-50%);
        background: var(--ink);
        box-shadow: 0 18px 32px rgba(17, 19, 17, 0.22);
        transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .dock:hover,
      .dock:focus-within {
        width: 176px;
      }
      .dock-head {
        display: grid;
        width: 100%;
        height: 48px;
        place-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        color: var(--green);
        font-size: 9px;
        letter-spacing: 0.16em;
        white-space: nowrap;
      }
      .dock a {
        position: relative;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 18px;
        gap: 8px;
        align-items: center;
        min-height: 58px;
        padding: 0 10px 0 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--white);
        text-decoration: none;
        overflow: hidden;
      }
      .dock a:last-child {
        border-bottom: 0;
      }
      .dock a:hover,
      .dock a:focus-visible {
        background: var(--green);
        color: var(--ink);
      }
      .glyph {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.32);
        font-size: 10px;
        font-weight: 700;
      }
      .dock a:hover .glyph,
      .dock a:focus-visible .glyph {
        border-color: var(--ink);
      }
      .dock strong {
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(8px);
        transition:
          opacity 0.2s ease,
          transform 0.25s ease;
      }
      .dock:hover strong,
      .dock:focus-within strong {
        opacity: 1;
        transform: translateX(0);
      }
      .arrow {
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .dock:hover .arrow,
      .dock:focus-within .arrow {
        opacity: 1;
      }
      .dock .contact {
        color: var(--green);
      }
      @media (max-width: 720px) {
        .frame {
          margin: 0 8px;
          padding: 24px 18px;
        }
        .panel {
          width: calc(100% - 54px);
          padding: 28px 24px;
        }
        .dock,
        .dock:hover,
        .dock:focus-within {
          width: 54px;
        }
        .dock-head,
        .dock strong,
        .arrow {
          display: none;
        }
        .dock a {
          grid-template-columns: 1fr;
          justify-items: center;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-head">
      <div class="logo">ACCELHACK<small>.inc</small></div>
      <span>OPTION C / EXPANDABLE DOCK</span>
    </header>
    <main class="frame">
      <p class="page-title">About</p>
      <section class="panel">
        <span class="eyebrow">ACCELHACK / ABOUT</span>
        <h1>ただのSIerじゃ、<br />つまらない。</h1>
        <p class="copy">
          見つけるところから維持するところまで、課題解決のすべてに答えを出します。
        </p>
      </section>
      <span class="option-label">C / COMPACT, QUIET, ON DEMAND</span>
    </main>
    <nav class="dock" aria-label="ページナビゲーション">
      <div class="dock-head">MENU</div>
      <a href="#"
        ><span class="glyph">W</span><strong>Works</strong
        ><span class="arrow">→</span></a
      >
      <a href="#"
        ><span class="glyph">R</span><strong>Recruit</strong
        ><span class="arrow">→</span></a
      >
      <a href="#"
        ><span class="glyph">B</span><strong>Blog</strong
        ><span class="arrow">→</span></a
      >
      <a class="contact" href="#"
        ><span class="glyph">C</span><strong>Contact</strong
        ><span class="arrow">→</span></a
      >
    </nav>
  </body>
</html>
