<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Tabs A — Index Rail</title>
    <style>
      :root {
        --paper: #f5f4f2;
        --white: #fafafa;
        --ink: #111311;
        --muted: #747b76;
        --line: rgba(17, 19, 17, 0.18);
        --green: #21ffaa;
        --green-ink: #08734c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, 'Noto Sans JP', sans-serif;
      }
      .site-head {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        letter-spacing: 0.12em;
      }
      .logo {
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .logo small {
        margin-left: 2px;
        font-size: 8px;
        font-weight: 400;
      }
      .frame {
        position: relative;
        height: calc(100vh - 88px);
        margin: 0 22px;
        padding: 34px 38px;
        border: 1px solid var(--line);
        background: rgba(250, 250, 250, 0.74);
        overflow: hidden;
      }
      .frame::before,
      .frame::after {
        position: absolute;
        width: 72px;
        height: 72px;
        border-color: var(--ink);
        content: '';
        pointer-events: none;
      }
      .frame::before {
        top: 8px;
        left: 8px;
        border-top: 2px solid;
        border-left: 2px solid;
      }
      .frame::after {
        right: 8px;
        bottom: 8px;
        border-right: 2px solid;
        border-bottom: 2px solid;
      }
      .page-title {
        margin: 0 0 34px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
        font-size: clamp(32px, 4vw, 58px);
        font-weight: 500;
      }
      .panel {
        width: calc(100% - 126px);
        min-height: 66vh;
        padding: clamp(32px, 5vw, 72px);
        border: 1px solid var(--line);
        background:
          linear-gradient(132deg, rgba(33, 255, 170, 0.12), transparent 38%),
          var(--white);
      }
      .eyebrow {
        color: var(--green-ink);
        font-size: 9px;
        letter-spacing: 0.18em;
      }
      h1 {
        max-width: 820px;
        margin: 42px 0 0;
        font-size: clamp(38px, 6vw, 86px);
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.065em;
      }
      .copy {
        max-width: 520px;
        margin: 34px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 2;
      }
      .option-label {
        position: absolute;
        left: 38px;
        bottom: 18px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.16em;
      }
      .rail {
        position: fixed;
        top: 50%;
        right: 0;
        z-index: 10;
        width: 156px;
        transform: translateY(-50%);
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        background: rgba(250, 250, 250, 0.92);
        backdrop-filter: blur(10px);
      }
      .rail-label {
        display: flex;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0.14em;
      }
      .rail a {
        position: relative;
        display: grid;
        grid-template-columns: 24px 1fr 14px;
        gap: 8px;
        align-items: center;
        min-height: 58px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        text-decoration: none;
        transition: padding 0.25s ease;
      }
      .rail a:last-child {
        border-bottom: 0;
      }
      .rail a::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--green);
        content: '';
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s ease;
      }
      .rail a:hover::before,
      .rail a:focus-visible::before {
        transform: scaleX(1);
      }
      .rail a:hover,
      .rail a:focus-visible {
        padding-left: 16px;
      }
      .num {
        color: var(--muted);
        font-size: 8px;
      }
      .name {
        font-size: 13px;
        font-weight: 700;
      }
      .arrow {
        font-size: 14px;
      }
      .rail .contact {
        background: var(--ink);
        color: var(--white);
      }
      @media (max-width: 720px) {
        .frame {
          margin: 0 8px;
          padding: 24px 18px;
        }
        .panel {
          width: calc(100% - 58px);
          padding: 28px 24px;
        }
        .rail {
          width: 58px;
        }
        .rail-label,
        .name,
        .num {
          display: none;
        }
        .rail a {
          grid-template-columns: 1fr;
          justify-items: center;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-head">
      <div class="logo">ACCELHACK<small>.inc</small></div>
      <span>OPTION A / INDEX RAIL</span>
    </header>
    <main class="frame">
      <p class="page-title">About</p>
      <section class="panel">
        <span class="eyebrow">ACCELHACK / ABOUT</span>
        <h1>ただのSIerじゃ、<br />つまらない。</h1>
        <p class="copy">
          見つけるところから維持するところまで、課題解決のすべてに答えを出します。
        </p>
      </section>
      <span class="option-label">A / THIN, ORDERED, ARCHITECTURAL</span>
    </main>
    <nav class="rail" aria-label="ページナビゲーション">
      <div class="rail-label"><span>GLOBAL</span><span>01—05</span></div>
      <a href="#"
        ><span class="num">01</span><span class="name">Works</span
        ><span class="arrow">→</span></a
      >
      <a href="#"
        ><span class="num">02</span><span class="name">Recruit</span
        ><span class="arrow">→</span></a
      >
      <a href="#"
        ><span class="num">03</span><span class="name">Blog</span
        ><span class="arrow">→</span></a
      >
      <a class="contact" href="#"
        ><span class="num">04</span><span class="name">Contact</span
        ><span class="arrow">→</span></a
      >
    </nav>
  </body>
</html>
