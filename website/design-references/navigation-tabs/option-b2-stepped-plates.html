<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Tabs B2 — Stepped Plates</title>
    <link rel="stylesheet" href="./b-variations-shared.css" />
    <style>
      .steps {
        position: fixed;
        top: 50%;
        right: 0;
        z-index: 10;
        display: grid;
        gap: 5px;
        width: 194px;
        transform: translateY(-50%);
        perspective: 900px;
      }
      .steps a {
        --step: 0px;
        position: relative;
        display: grid;
        grid-template-columns: 1fr 22px;
        align-items: center;
        width: calc(100% - var(--step));
        min-height: 68px;
        margin-left: var(--step);
        padding: 0 14px 0 24px;
        clip-path: polygon(13px 0, 100% 0, 100% 100%, 0 100%, 0 13px);
        background: rgba(250, 250, 250, 0.96);
        box-shadow: 13px 15px 20px rgba(17, 19, 17, 0.2);
        color: var(--ink);
        text-decoration: none;
        transform: rotateY(-4deg);
        transform-origin: right center;
        transition:
          width 0.3s ease,
          margin 0.3s ease,
          background 0.3s ease,
          transform 0.3s ease;
      }
      .steps a:nth-child(2) {
        --step: 15px;
      }
      .steps a:nth-child(3) {
        --step: 30px;
      }
      .steps a:nth-child(4) {
        --step: 45px;
      }
      .steps a::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--green);
        content: '';
      }
      .steps a:hover,
      .steps a:focus-visible {
        width: 100%;
        margin-left: 0;
        background: var(--green);
        transform: translateX(-12px) rotateY(0);
      }
      .steps strong {
        font-size: 15px;
      }
      .steps small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 7px;
        letter-spacing: 0.13em;
      }
      .steps i {
        font-size: 15px;
        font-style: normal;
      }
      .steps .contact {
        background: var(--ink);
        color: var(--white);
      }
      .steps .contact small {
        color: rgba(255, 255, 255, 0.58);
      }
      @media (max-width: 720px) {
        .steps {
          width: 72px;
        }
        .steps a,
        .steps a:nth-child(n) {
          width: 100%;
          margin-left: 0;
          grid-template-columns: 1fr;
          justify-items: center;
          padding: 0;
          transform: none;
        }
        .steps strong,
        .steps small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-head">
      <div class="logo">ACCELHACK<small>.inc</small></div>
      <span>OPTION B2 / STEPPED PLATES</span>
    </header>
    <main class="frame">
      <p class="page-title">About</p>
      <section class="panel">
        <span class="eyebrow">ACCELHACK / ABOUT</span>
        <h1>ただのSIerじゃ、<br />つまらない。</h1>
        <p class="copy">
          見つけるところから維持するところまで、課題解決のすべてに答えを出します。
        </p>
      </section>
      <span class="option-label">B2 / RHYTHM AND MOVEMENT</span>
    </main>
    <nav class="steps" aria-label="ページナビゲーション">
      <a href="#"
        ><span><strong>Works</strong><small>01 / PROJECTS</small></span
        ><i>→</i></a
      >
      <a href="#"
        ><span><strong>Recruit</strong><small>02 / PEOPLE</small></span
        ><i>→</i></a
      >
      <a href="#"
        ><span><strong>Blog</strong><small>03 / JOURNAL</small></span
        ><i>→</i></a
      >
      <a class="contact" href="#"
        ><span><strong>Contact</strong><small>04 / CONNECT</small></span
        ><i>→</i></a
      >
    </nav>
  </body>
</html>
