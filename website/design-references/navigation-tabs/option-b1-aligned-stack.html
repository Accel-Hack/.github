<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Tabs B1 — Aligned Stack</title>
    <link rel="stylesheet" href="./b-variations-shared.css" />
    <style>
      .stack {
        position: fixed;
        top: 50%;
        right: 0;
        z-index: 10;
        display: grid;
        gap: 8px;
        width: 172px;
        transform: translateY(-50%);
      }
      .stack a {
        position: relative;
        display: grid;
        grid-template-columns: 26px 1fr 20px;
        gap: 8px;
        align-items: center;
        min-height: 66px;
        padding: 0 13px;
        border: 1px solid rgba(17, 19, 17, 0.14);
        background: rgba(250, 250, 250, 0.95);
        box-shadow: 12px 14px 22px rgba(17, 19, 17, 0.17);
        color: var(--ink);
        text-decoration: none;
        transition:
          transform 0.3s ease,
          background 0.3s ease;
      }
      .stack a::before {
        position: absolute;
        top: 7px;
        right: -6px;
        z-index: -1;
        width: 100%;
        height: 100%;
        border: 1px solid rgba(17, 19, 17, 0.13);
        background: rgba(255, 255, 255, 0.46);
        content: '';
      }
      .stack a:hover,
      .stack a:focus-visible {
        background: var(--green);
        transform: translateX(-14px);
      }
      .stack small {
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0.12em;
      }
      .stack strong {
        font-size: 14px;
      }
      .stack i {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: var(--white);
        font-size: 8px;
        font-style: normal;
      }
      .stack .contact {
        margin-top: 8px;
        background: #4b4f4c;
        color: var(--white);
      }
      .stack .contact small {
        color: rgba(255, 255, 255, 0.58);
      }
      @media (max-width: 720px) {
        .stack {
          width: 66px;
        }
        .stack a {
          grid-template-columns: 1fr;
          justify-items: center;
          padding: 0;
        }
        .stack strong,
        .stack small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-head">
      <div class="logo">ACCELHACK<small>.inc</small></div>
      <span>OPTION B1 / ALIGNED STACK</span>
    </header>
    <main class="frame">
      <p class="page-title">About</p>
      <section class="panel">
        <span class="eyebrow">ACCELHACK / ABOUT</span>
        <h1>ただのSIerじゃ、<br />つまらない。</h1>
        <p class="copy">
          見つけるところから維持するところまで、課題解決のすべてに答えを出します。
        </p>
      </section>
      <span class="option-label">B1 / ORDERED DEPTH</span>
    </main>
    <nav class="stack" aria-label="ページナビゲーション">
      <a href="#"><small>01</small><strong>Works</strong><i>→</i></a>
      <a href="#"><small>02</small><strong>Recruit</strong><i>→</i></a>
      <a href="#"><small>03</small><strong>Blog</strong><i>→</i></a>
      <a class="contact" href="#"
        ><small>04</small><strong>Contact</strong><i>→</i></a
      >
    </nav>
  </body>
</html>
